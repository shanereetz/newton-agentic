<div id="vbd-drive">
  <div class="viz-row"><strong>Newton · VBD</strong><span class="text-small">Recorded physics run</span></div>
  <div class="viz-controls">
    <button type="button" class="btn" data-play>Play</button>
    <label class="form-label">Time <span data-time class="tabular-nums"></span><input class="form-range" data-time-slider type="range" min="0" value="0" step="1"></label>
    <label class="form-label">View <select class="form-select" data-view><option value="top">Top</option><option value="3d">3D</option></select></label>
    <label class="form-check"><input class="form-check-input" data-contacts type="checkbox" checked><span class="form-check-label">Contact points</span></label>
  </div>
  <canvas style="display:block;width:100%;height:420px" role="img" aria-label="Simulated harmonic drive. The rotating cam deforms the toothed ring; highlighted points show contact. Drag to rotate the 3D view."></canvas>
  <div class="viz-row text-small" data-legend><span style="color:var(--viz-series-1)">● Circular spline</span><span style="color:var(--viz-series-2)">● Flexspline</span><span style="color:var(--viz-series-3)">● Wave generator</span><span style="color:var(--viz-series-4)">● Contact</span></div>
  <div class="viz-row text-small tabular-nums" aria-live="polite" data-metrics></div>
</div>
<script>
(()=>{
const data=__DATA__;
const root=document.getElementById('vbd-drive'),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=root.querySelector('[data-time-slider]'),play=root.querySelector('[data-play]'),view=root.querySelector('[data-view]');
slider.max=data.frames.length-1;
let index=0,playing=false,last=0,elapsed=0,azimuth=.3,drag=null;
const colorNodes=[...root.querySelectorAll('[data-legend] span')];
function draw(){
 const frame=data.frames[index],width=root.clientWidth,height=Math.min(420,width+30),dpr=window.devicePixelRatio||1;
 canvas.style.height=height+'px';canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.scale(dpr,dpr);
 const palette=colorNodes.map(el=>getComputedStyle(el).color),foreground=getComputedStyle(root).color;
 const tilt=view.value==='top'?0:.72,ca=Math.cos(azimuth),sa=Math.sin(azimuth),ct=Math.cos(tilt),st=Math.sin(tilt),scale=Math.min((width-20)/72,(height-20)/72);
 function project(v){const [x,y,z]=v,X=x*ca-y*sa,Y=x*sa+y*ca;return [width/2+X*scale,height/2+(-Y*ct+z*st)*scale,Y*st+z*ct];}
 const camCos=Math.cos(frame.angle),camSin=Math.sin(frame.angle);
 const objects=[{v:data.circular.v,f:data.circular.f},{v:frame.q,f:data.surface},{v:data.cam.v.map(([x,y,z])=>[x*camCos-y*camSin,x*camSin+y*camCos,z]),f:data.cam.f}];
 const polygons=[];
 objects.forEach((o,k)=>{
  const points=o.v.map(project);
  o.f.forEach(face=>{const p=face.map(i=>points[i]);const area=(p[1][0]-p[0][0])*(p[2][1]-p[0][1])-(p[1][1]-p[0][1])*(p[2][0]-p[0][0]);if(area>=-1e-8)return;
   const a=o.v[face[0]],b=o.v[face[1]],c=o.v[face[2]],u=b.map((v,i)=>v-a[i]),v=c.map((v,i)=>v-a[i]),n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],length=Math.hypot(...n);
   polygons.push({p,k,depth:p.reduce((s,p)=>s+p[2],0)/3,shade:.6+.4*Math.abs((n[0]*.25+n[1]*-.3+n[2]*.9)/length)});
  });
 });
 polygons.sort((a,b)=>a.depth-b.depth).forEach(({p,k,shade})=>{ctx.globalAlpha=shade;ctx.fillStyle=palette[k];ctx.strokeStyle=palette[k];ctx.lineWidth=.4;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);ctx.lineTo(p[1][0],p[1][1]);ctx.lineTo(p[2][0],p[2][1]);ctx.closePath();ctx.fill();ctx.stroke();});ctx.globalAlpha=1;
 // A material marker moves with the simulated flexspline, never with the ideal ratio.
 const marker=project(frame.q[Math.floor(frame.q.length*.75)]);ctx.fillStyle=foreground;ctx.beginPath();ctx.arc(marker[0],marker[1],4,0,Math.PI*2);ctx.fill();
 if(root.querySelector('[data-contacts]').checked){ctx.fillStyle=palette[3];frame.force.forEach((force,i)=>{if(force<=0||frame.q[i][2]<0)return;const p=project(frame.q[i]);ctx.beginPath();ctx.arc(p[0],p[1],2.4,0,Math.PI*2);ctx.fill();});}
 // The line is a visible input-shaft orientation reference.
 const tip=project([20*camCos,20*camSin,3.05]),base=project([5*camCos,5*camSin,3.05]);ctx.strokeStyle=foreground;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(base[0],base[1]);ctx.lineTo(tip[0],tip[1]);ctx.stroke();
 root.querySelector('[data-time]').textContent=frame.t.toFixed(2)+' s';slider.value=index;
 if(!playing)updateMetrics();
}
function updateMetrics(){const m=data.frames[index].metrics;root.querySelector('[data-metrics]').textContent=`Input ${(m.input_rad*180/Math.PI).toFixed(1)}° · Output ${(m.output_rad*180/Math.PI).toFixed(2)}° · Tooth contacts ${m.ring_contacts} · Cam contacts ${m.cam_contacts}`;}
function animate(t){if(!playing)return;elapsed+=(t-last)/1000;last=t;const end=data.frames[data.frames.length-1].t;while(index<data.frames.length-1&&data.frames[index+1].t<=elapsed)index++;draw();if(elapsed>=end){playing=false;play.textContent='Replay';updateMetrics();}else requestAnimationFrame(animate);}
play.addEventListener('click',()=>{playing=!playing;play.textContent=playing?'Pause':'Play';if(playing){if(index===data.frames.length-1)index=0;elapsed=data.frames[index].t;last=performance.now();requestAnimationFrame(animate);}else updateMetrics();});
slider.addEventListener('input',()=>{playing=false;play.textContent='Play';index=Number(slider.value);draw();});view.addEventListener('change',draw);root.querySelector('[data-contacts]').addEventListener('change',draw);
canvas.addEventListener('pointerdown',e=>{if(view.value==='3d'){drag=e.clientX;canvas.setPointerCapture(e.pointerId);}});canvas.addEventListener('pointermove',e=>{if(drag!==null){azimuth+=(e.clientX-drag)*.01;drag=e.clientX;draw();}});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
new ResizeObserver(draw).observe(root);new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});draw();
})();
</script>
